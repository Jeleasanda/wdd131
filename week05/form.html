<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A dynamic product review form where users can rate products, select features they found useful, and leave a written review.">
    <meta name="author" content="Asanda Jele">
    <title>Product Review Form</title>
    
    <!-- Pointing to your Styles folder (capital S) -->
    <link rel="stylesheet" href="Styles/form.css">
    
    <!-- Pointing to your scripts folder (lowercase s) -->
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            
            <!-- Product Name -->
            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <div class="form-group">
                <label>Overall Rating</label>
                <div class="rating-container">
                    <label><input type="radio" id="rating1" name="rating" value="1" required> ☆</label>
                    <label><input type="radio" id="rating2" name="rating" value="2" required> ☆☆</label>
                    <label><input type="radio" id="rating3" name="rating" value="3" required> ☆☆☆</label>
                    <label><input type="radio" id="rating4" name="rating" value="4" required> ☆☆☆☆</label>
                    <label><input type="radio" id="rating5" name="rating" value="5" required> ☆☆☆☆☆</label>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <div class="form-group">
                <label>Which features did you find useful in the product?<br><em>(Check all that apply)</em></label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="feat1" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" id="feat2" name="features" value="ease-of-use"> Ease of Use</label>
                    <label><input type="checkbox" id="feat3" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" id="feat4" name="features" value="design"> Design</label>
                </div>
            </div>

            <!-- Written Review -->
            <div class="form-group">
                <label for="writtenReview">Written Review (Optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </div>

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Asanda Jele | South Africa</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
