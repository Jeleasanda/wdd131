<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review confirmation page showing how many reviews you have submitted.">
    <title>Review Submitted</title>
    <!-- Pointing to the styles folder -->
    <link rel="stylesheet" href="styles/form.css">
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let reviewCount = Number(window.localStorage.getItem('reviewCount-ls')) || 0;
            reviewCount++;
            window.localStorage.setItem('reviewCount-ls', reviewCount);
            document.getElementById('reviewCount').textContent = reviewCount;
        });
    </script>
</head>
<body>
    <header>
        <h1>Review Submitted</h1>
    </header>
    <main>
        <div class="form-group" style="text-align: center; background: white; padding: 2rem; border-radius: 8px;">
            <h2>Thank you for your review!</h2>
            <p>You have completed <span id="reviewCount">0</span> reviews.</p>
            <br>
            <a href="form.html" style="color: var(--primary-color); font-weight: bold;">Submit another review</a>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Asanda Jele | South Africa</p>
    </footer>
</body>
</html>
